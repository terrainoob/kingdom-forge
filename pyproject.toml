[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kingdom-forge"
version = "0.1.0"
description = "A configuration-driven publishing engine for Kingdom of Sir Pops branding."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kingdom Forge Contributors" }]
dependencies = [
    "PyYAML>=6.0.2,<7",
    "Pillow>=10.4,<12",
    "numpy>=2.1,<3",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
kingdom-forge = "kingdom_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdom_forge"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
